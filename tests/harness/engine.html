<!doctype html><meta charset="utf-8"><title>engine harness</title>
<script type="module">
import { TtsClient } from '/src/core/tts/client.ts';
import { normaliseForSpeech } from '/src/core/text/normalise.ts';
import { compileRules } from '/src/core/text/pronounce.ts';
window.runTts = async (text, voice, mirror) => {
  window.__c ??= new TtsClient({ kokoroBase: mirror, piperBase: mirror + '/piper' });
  const t0 = performance.now();
  await window.__c.prepare(voice);
  const tPrep = performance.now() - t0;
  const rules = compileRules([]);
  const p = rules.protect(text);
  const spoken = rules.restore(normaliseForSpeech(p.text), p.slots);
  const clip = await window.__c.synth(spoken, voice, 1);
  return { spoken, sr: clip.sampleRate, ms: clip.ms, prepMs: tPrep, pcm: Array.from(clip.pcm) };
};
window.ready = true;
</script>
